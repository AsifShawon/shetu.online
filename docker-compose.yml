# Convenience default for local development.
# Production must use docker-compose.prod.yml.
services:
  mysql:
    image: mysql:8.4
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-eduwise_v3}
      MYSQL_USER: ${MYSQL_USER:-eduwise}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-eduwise_local_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-eduwise_local_root_password}
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - eduwise_mysql_data_local:/var/lib/mysql

  backend:
    build:
      context: ./backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-local}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-eduwise_v3}
      MYSQL_USER: ${MYSQL_USER:-eduwise}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-eduwise_local_password}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST:-smtp.gmail.com}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-true}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-Shetu <noreply@shetu.com.bd>}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      SEED_BASIC_CATALOG: ${SEED_BASIC_CATALOG:-true}
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - eduwise_backend_media_local:/app/media

  frontend:
    build:
      context: ./frontend
      target: deps
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
      SERVER_API_BASE_URL: ${SERVER_API_BASE_URL:-http://backend:8000}
      INTERNAL_API_BASE_URL: ${SERVER_API_BASE_URL:-http://backend:8000}
      NEXT_TELEMETRY_DISABLED: 1
      WATCHPACK_POLLING: ${WATCHPACK_POLLING:-true}
    command: npm run dev -- --hostname 0.0.0.0 --port 3000
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - eduwise_frontend_node_modules_local:/app/node_modules
      - eduwise_frontend_next_local:/app/.next

volumes:
  eduwise_mysql_data_local:
  eduwise_backend_media_local:
  eduwise_frontend_node_modules_local:
  eduwise_frontend_next_local:
